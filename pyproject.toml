# Konfiguration der Entwicklungswerkzeuge und des Android-Builds. Das
# Programm selbst wird nicht als Paket installiert (Start über main.py).

# ------------------------------------------------- Android-App (build_apk.py)
# "flet build apk" liest [project] und [tool.flet]. Die PC-Version nutzt
# requirements.txt; in die App kommen nur die Pakete, die dort laufen:
# Google Drive (Anmeldung im Browser auf demselben Gerät) und keyring
# (Windows-Anmeldeinformationen) fehlen auf dem Handy bewusst.
# Die Versionsnummer setzt build_apk.py aus appinfo.VERSION.
[project]
name = "mangalibraryv2"
version = "0.0.0"
description = "Manga- und Light-Novel-Bibliothek"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",   # wie requirements.txt
    "requests>=2.28.0",
]

[tool.flet]
org = "eu.sturmschleier"
product = "Manga Library V2"
company = "Sturmschleier"
copyright = "© 2026 Sturmschleier, MIT-Lizenz"

[tool.flet.app]
module = "main"

[tool.flet.android.permission]
# Internet: VÖ-Termine, Cover, ISBN, Postfach und Geräte-Abgleich im WLAN
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

# Wie bei der Anime-Liste: Neuere Versionen dieser Plugins (ab Flutter 3.44)
# setzen AGP 9 voraus, Flets Android-Vorlage nutzt AGP 8.11.
[tool.flet.flutter.pubspec.dependency_overrides]
shared_preferences_android = "2.4.23"
url_launcher_android = "6.3.30"

[tool.ruff]
# älteste unterstützte Version (Flet 1.0 braucht Python 3.10) - Ruff schlägt nur vor, was dort läuft
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # Pyflakes: echte Fehler wie ungenutzte Importe, undefinierte Namen
    "E",    # pycodestyle: Fehler
    "W",    # pycodestyle: Warnungen
    "B",    # flake8-bugbear: typische Fallstricke
    "BLE",  # flake8-blind-except: pauschales "except Exception" nur mit Begründung (noqa)
    "I",    # isort: Reihenfolge der Importe
    "UP",   # pyupgrade: veraltete Schreibweisen
    "SIM",  # flake8-simplify: vereinfachbarer Code
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie: überflüssige Konstrukte
    "RUF",  # Ruff-eigene Regeln
]
ignore = [
    # Deutsche Anführungszeichen „…“ und der Gedankenstrich „–“ in Texten sind gewollt
    "RUF001", "RUF002", "RUF003",
    # Optional[X] bleibt einheitlich: "X | None" ginge mit Python 3.9 nur in
    # Dateien mit "from __future__ import annotations"
    "UP007", "UP045",
    # try/except/pass mit erklärendem Kommentar ist hier lesbarer als contextlib.suppress
    "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = [
    "appinfo", "build_apk", "changelog", "colors", "config", "csv_export", "database", "device_sync", "drive_sync", "gallery", "import_csv", "instance_lock",
    "isbn_lookup", "library", "logic", "mail_fetch", "main", "models", "order_mail", "paths", "release_calendar", "shops", "sorting", "sync_merge", "ui", "vlb_lookup",
]
